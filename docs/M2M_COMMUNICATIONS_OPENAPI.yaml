openapi: 3.1.0
info:
  title: Voronka M2M Communications (Signal)
  version: 0.1.0
  description: |
    Scoped server-to-server API for СИГНАЛ (SIG-4 + Wave C additive person/timeline).
    Normative twin: signal repo docs/VORONKA_M2M_OPENAPI.yaml
    Auth: HMAC wire v1 (SIGNAL_M2M_SECRET). No crm_session. No bot tokens in responses.
    Wave C: campaign/asset/hub contracts unchanged; person:read / timeline:read are additive.
    CJ-108: timeline:write ingest writes Communication/DeliveryEvent/Interaction (no HTML bodies).
    PDialog P0: scenario:publish|pause|status — accept immutable Version; llm_reply descriptors allowed; no auto_send.
servers:
  - url: https://voronka.solo-pr.ru
paths:
  /api/crm/m2m/projects/{pid}/connections/hub:
    get:
      summary: Connections hub (presence flags only)
      x-required-scopes: [connection:hub:read]
  /api/crm/m2m/projects/{pid}/media-assets:
    get:
      summary: Media assets list (redacted)
      x-required-scopes: [asset:read]
  /api/crm/m2m/projects/{pid}/assets/import:
    post:
      summary: Import asset with sha256 checksum
      description: >
        Optional signal_asset_id links Voronka bank row to Registry/Signal SoR id.
        Response never includes Telegram file_id. Bank is delivery cache only.
      x-required-scopes: [asset:import]
  /api/crm/m2m/projects/{pid}/assets/ensure-from-signal:
    post:
      summary: Fetch Registry/Signal bytes by asset_id → Voronka bank (Wave B)
      description: >
        Idempotent by signal_asset_id / sha256. Preferred SoR fetch = Registry
        presign; fallback = Signal GET /api/v1/internal/media/{id}/content.
        No second operator media library.
      x-required-scopes: [asset:import]
  /api/crm/m2m/projects/{pid}/persons/{person_id}/media-refs:
    get:
      summary: List soft Registry asset_id refs on Person timeline
      x-required-scopes: [timeline:read]
    post:
      summary: Soft-attach Registry asset_id (Interaction only; no CRM blob store)
      x-required-scopes: [timeline:write]
  /api/crm/m2m/projects/{pid}/media/signal/{signal_asset_id}/content:
    get:
      summary: Fetch-by-asset_id proxy (raw bytes; never file_id)
      x-required-scopes: [asset:read]
  /api/crm/m2m/projects/{pid}/contacts:
    get:
      summary: Limited contact/tag projection
      x-required-scopes: [contact:segment:read]
  /api/crm/m2m/projects/{pid}/segments/export:
    post:
      summary: CAMP-101 sendable segment export (Person + ContactPoint + send_allowed)
      description: >
        Paginated export of project Persons with a ContactPoint for the requested
        channel. When only_sendable=true (default), each row must pass
        send_allowed(purpose, missing_policy=deny). Returns person_id,
        contact_point_id, address — unlike GET /contacts (profile/tag only).
      x-required-scopes: [contact:segment:read]
  /api/crm/m2m/projects/{pid}/campaigns:
    post:
      summary: Create draft campaign (external_idempotency_key)
      x-required-scopes: [campaign:create]
  /api/crm/m2m/campaigns/{cid}/preflight:
    post:
      summary: Preflight
      x-required-scopes: [campaign:preflight]
  /api/crm/m2m/campaigns/{cid}/launch:
    post:
      summary: Launch into Outbox (idempotent)
      x-required-scopes: [campaign:launch]
  /api/crm/m2m/campaigns/{cid}/cancel:
    post:
      summary: Cancel campaign + pending outbox
      x-required-scopes: [campaign:cancel]
  /api/crm/m2m/campaigns/{cid}/delivery:
    get:
      summary: Delivery aggregate + honest projection
      x-required-scopes: [campaign:read]
  /api/crm/m2m/projects/{pid}/persons/{person_id}:
    get:
      summary: Person + contact points (Wave C; SoR Voronka)
      x-required-scopes: [person:read]
  /api/crm/m2m/projects/{pid}/persons/{person_id}/timeline:
    get:
      summary: Customer 360 timeline projection
      x-required-scopes: [timeline:read]
  /api/crm/m2m/projects/{pid}/communications/ingest:
    post:
      summary: Ingest Signal CE queued/accepted/failed into Person timeline (CJ-108)
      description: >
        Upserts Communication (by communication_key), DeliveryEvent + Interaction
        (by external_event_key). body_preview ≤500 plain text only — no HTML/email bodies.
        Resolve person via person_id or project-scoped email (ambiguous → 422).
      x-required-scopes: [timeline:write]
  /api/crm/m2m/projects/{pid}/send-policy/check:
    post:
      summary: Send-policy preflight (CRM-102)
      x-required-scopes: [person:read]
  /api/crm/m2m/projects/{pid}/scenarios/versions:
    post:
      summary: Accept/store immutable Personal Dialog Version (PDialog P0)
      description: >
        Idempotent by external_idempotency_key. Graph may include llm_reply /
        escalate / send_template / tag_contact descriptors. auto_send forbidden.
      x-required-scopes: [scenario:publish]
  /api/crm/m2m/projects/{pid}/executions/{execution_id}/pause:
    post:
      summary: Pause a Run for Personal Dialog operator façade
      x-required-scopes: [scenario:pause]
  /api/crm/m2m/projects/{pid}/scenarios/versions/{version_id}/status:
    get:
      summary: Published version meta + run aggregate (no tokens)
      x-required-scopes: [scenario:status]
components:
  securitySchemes:
    SignalHmac:
      type: apiKey
      in: header
      name: X-Signal-Signature
      description: >
        Also require X-Signal-Timestamp, X-Signal-Jti, X-Signal-Service, X-Signal-Scopes.
        signature = HMAC-SHA256(secret, "{ts}." + raw_body)
