# CRM portal vhost: https://crm.solo-pr.ru → voronka /crm/
# Include from the shared nginx host. TLS via certbot (SAN with cms/voronka/lms).
# App also redirects Host=crm.* path=/ → /crm/ (host-aware fallback).

server {
    listen 80;
    listen [::]:80;
    server_name crm.solo-pr.ru;
    client_max_body_size 55m;

    location = / {
        return 302 /crm/;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
