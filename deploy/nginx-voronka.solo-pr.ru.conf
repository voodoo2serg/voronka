# Voronka ops vhost: https://voronka.solo-pr.ru
# Mini App stays at / (Telegram WebApp URL + sslip compat). Browser ops UI: /ops/
# Hooks keep a smaller body limit. TLS via certbot (SAN with cms/crm/lms).
# Do NOT redirect / → /ops/ — that would break existing Mini App bookmarks.

server {
    listen 80;
    listen [::]:80;
    server_name voronka.solo-pr.ru;
    client_max_body_size 55m;

    location /hooks/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
