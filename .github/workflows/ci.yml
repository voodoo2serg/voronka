name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ffmpeg -version && docker compose version
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app migrations tests
      - run: python -m pytest -q
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet

  migrations:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funnel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: funnel
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U funnel -d funnel"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      OWNER_TELEGRAM_ID: 123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  postgres-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funnel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: funnel
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U funnel -d funnel"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      TEST_DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      REDIS_URL: redis://localhost:6379/0
      OWNER_TELEGRAM_ID: 123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ffmpeg -version && docker compose version
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_operational.py tests/test_crm.py tests/test_vor_ops.py
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voronka-ci:${{ github.run_id }}-${{ github.run_attempt }} .
      - run: docker run --rm --entrypoint ffprobe voronka-ci:${{ github.run_id }}-${{ github.run_attempt }} -version
      - run: docker run --rm -v voronka-ci-media-${{ github.run_id }}-${{ github.run_attempt }}:/data/media --entrypoint python voronka-ci:${{ github.run_id }}-${{ github.run_attempt }} -c "from pathlib import Path; p=Path('/data/media/write-test'); p.write_text('ok'); p.unlink()"
      - if: always()
        run: |
          docker image rm voronka-ci:${{ github.run_id }}-${{ github.run_attempt }} || true
          docker volume rm voronka-ci-media-${{ github.run_id }}-${{ github.run_attempt }} || true
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    env:
      RUN_BROWSER: '1'
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: PORTAL_BASE=/crm NEXT_PUBLIC_PORTAL=crm npm run --prefix web build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_editor_browser.py tests/test_crm_browser.py

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, voronka-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: PORTAL_BASE=/crm NEXT_PUBLIC_PORTAL=crm npm run --prefix web build
      - run: PORTAL_BASE=/ops NEXT_PUBLIC_PORTAL=ops npm run --prefix web build
      - run: npm run --prefix web typecheck
