services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: funnel
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U funnel -d funnel"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set domain}
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  caddydata:
