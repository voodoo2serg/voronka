x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:16
    environment:
      POSTGRES_DB: funnel
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U funnel -d funnel"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    <<: *logging
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    mem_limit: 256m
    restart: unless-stopped
  migrate:
    <<: *logging
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *logging
    build: .
    env_file: .env
    # Loopback only. On a dedicated server, HTTPS is `docker compose --profile edge up`.
    # On a host that already uses 80/443, nginx proxies to this port.
    ports: ["127.0.0.1:${API_PORT:-18080}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [media:/data/media]
    mem_limit: 768m
    restart: unless-stopped
  worker:
    <<: *logging
    build: .
    env_file: .env
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [media:/data/media]
    mem_limit: 512m
    restart: unless-stopped
  proxy:
    <<: *logging
    image: caddy:2
    profiles: ["edge"]
    environment:
      DOMAIN: ${DOMAIN:?set domain}
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  caddydata:
  media:
